name: Deploy to Firebase Hosting + Functions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web app (Hosting)
        run: pnpm --filter @workspace/web-app run build
        env:
          FIREBASE_DEPLOY: true
          NODE_ENV: production

      - name: Install Functions Dependencies
        run: |
          cd functions
          pnpm install --ignore-scripts

      - name: Build Cloud Functions
        run: |
          cd functions
          rm -rf lib
          node build.mjs

      - name: Set up Firebase CLI & Service Account
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHIKEN_D8789 }}' > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          pnpm exec firebase use shiken-d8789 --add || true

      - name: Delete stale function (clears old CPU metadata)
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHIKEN_D8789 }}' > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          # Delete the old function to clear its derived CPU metadata from runWith()
          # The new deployment will create it fresh with no CPU settings
          pnpm exec firebase functions:delete api --project shiken-d8789 -f || true
          rm -f /tmp/sa.json

      - name: Deploy Hosting + Functions (Unified)
        env:
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHIKEN_D8789 }}' > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          # Unified deploy ensures BOTH hosting and functions deploy together
          pnpm exec firebase deploy --only hosting,functions --project shiken-d8789
          rm -f /tmp/sa.json
