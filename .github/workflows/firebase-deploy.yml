name: Deploy to Firebase Hosting + Functions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web app (Hosting)
        run: pnpm --filter @workspace/web-app run build
        env:
          FIREBASE_DEPLOY: true
          NODE_ENV: production

      - name: Build Cloud Functions
        run: pnpm --filter @workspace/firebase-functions run build

      - name: Set up Firebase CLI & Service Account
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHIKEN_D8789 }}' > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          pnpm exec firebase use shiken-d8789 --add || true

      - name: Set Firebase Functions Environment Variables
        env:
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHIKEN_D8789 }}' > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          # Set both config (legacy) and env vars (modern) for maximum compatibility
          pnpm exec firebase functions:config:set \
            razorpay.key_id="$RAZORPAY_KEY_ID" \
            razorpay.key_secret="$RAZORPAY_KEY_SECRET" \
            gemini.api_key="$GEMINI_API_KEY" \
            callmebot.key="$CALLMEBOT_API_KEY" \
            callmebot.phone="$CALLMEBOT_PHONE" \
            --project shiken-d8789 || true
          # Also set as direct env vars (process.env access)
          pnpm exec firebase functions:env:set \
            RAZORPAY_KEY_ID="$RAZORPAY_KEY_ID" \
            RAZORPAY_KEY_SECRET="$RAZORPAY_KEY_SECRET" \
            GEMINI_API_KEY="$GEMINI_API_KEY" \
            CALLMEBOT_API_KEY="$CALLMEBOT_API_KEY" \
            CALLMEBOT_PHONE="$CALLMEBOT_PHONE" \
            --project shiken-d8789 || true
          rm -f /tmp/sa.json

      - name: Deploy Hosting + Functions (Unified)
        env:
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHIKEN_D8789 }}' > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          # Unified deploy ensures BOTH hosting and functions deploy together
          pnpm exec firebase deploy --only hosting,functions --project shiken-d8789
          rm -f /tmp/sa.json
