name: Deploy to Firebase Hosting + Functions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web app (Hosting)
        run: pnpm --filter @workspace/web-app run build
        env:
          FIREBASE_DEPLOY: true
          NODE_ENV: production
          VITE_RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}

      - name: Remove stale functions lockfile
        run: rm -f functions/pnpm-lock.yaml

      - name: Install Functions Dependencies
        run: |
          cd functions
          pnpm install --ignore-scripts

      - name: Remove lockfile before deploy (Cloud Build must install fresh)
        run: rm -f functions/pnpm-lock.yaml

      - name: Build Cloud Functions
        run: |
          cd functions
          rm -rf lib
          node build.mjs

      - name: Set up Firebase CLI & Service Account
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHIKEN_D8789 }}' > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          pnpm exec firebase use shiken-d8789 --add

      - name: Verify Function Build Output Exists
        run: |
          if [ ! -f "functions/lib/index.js" ]; then
            echo "ERROR: functions/lib/index.js not found — build step failed"
            exit 1
          fi
          echo "Function build output verified ($(wc -c < functions/lib/index.js) bytes)"

      - name: Deploy Hosting + Functions (Unified)
        env:
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHIKEN_D8789 }}' > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          
          # Backend (Functions) ke liye automatic .env file banana
          echo "RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}" >> functions/.env
          echo "RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}" >> functions/.env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> functions/.env
          
          # Deploy hosting and functions together — DO NOT delete function first
          pnpm exec firebase deploy --only hosting,functions --project shiken-d8789 --force
          rm -f /tmp/sa.json

      - name: Verify Cloud Function Deployed
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHIKEN_D8789 }}' > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          echo "Checking if api function exists..."
          pnpm exec firebase functions:list --project shiken-d8789 | grep -q "api" || {
            echo "ERROR: Cloud Function 'api' not found after deploy!"
            exit 1
          }
          echo "SUCCESS: Cloud Function 'api' is deployed"
          rm -f /tmp/sa.json
 
