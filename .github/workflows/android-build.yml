name: Build Android AAB (Play Store)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'App version name (e.g. 1.0.0)'
        required: true
        default: '1.0.1'
      version_code:
        description: 'Version code (integer, increment each release)'
        required: true
        default: '2'

jobs:
  build-android:
    name: Build Signed AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend (production)
        working-directory: artifacts/web-app
        run: pnpm run build
        env:
          FIREBASE_DEPLOY: true
          NODE_ENV: production

      - name: Force Add and Sync Android Platform
        working-directory: artifacts/web-app
        run: |
          pnpm add -D @capacitor/cli @capacitor/core @capacitor/android
          
          if [ -d "out" ] && [ ! -d "dist" ]; then cp -r out dist; fi
          if [ -d "build" ] && [ ! -d "dist" ]; then cp -r build dist; fi
          if [ -d ".next" ] && [ ! -d "dist" ]; then cp -r .next dist; fi
          
          mkdir -p dist
          if [ ! -f "dist/index.html" ]; then echo "<html><body>Shiken Web App Fallback</body></html>" > dist/index.html; fi
          
          npx cap init Shiken com.shambhuanu.shiken --web-dir=dist || echo "Already initialized"
          npx cap add android || echo "Android folder exists"

      - name: Sync Capacitor
        working-directory: artifacts/web-app
        run: npx cap sync android

      - name: Create plugins JSON placeholder if missing
        run: |
          mkdir -p artifacts/web-app/android/app/src/main/assets
          echo "{}" > artifacts/web-app/android/app/src/main/assets/capacitor.plugins.json

      # 🛠️ FIXED: Decode keystore to a central absolute workspace folder
      - name: Decode keystore from secret
        run: |
          mkdir -p ${{ github.workspace }}/keystore-holder
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/keystore-holder/release.keystore

      - name: Set version code and version name in build.gradle
        working-directory: artifacts/web-app/android/app
        run: |
          if [ -f build.gradle ]; then
            sed -i "s/versionCode .*/versionCode ${{ github.event.inputs.version_code }}/" build.gradle
            sed -i "s/versionName .*/versionName \"${{ github.event.inputs.version_name }}\"/" build.gradle
          fi

      # 🛠️ FIXED: Using full absolute path for injected signing store file
      - name: Build signed Release AAB
        working-directory: artifacts/web-app/android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/keystore-holder/release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Find and rename AAB
        run: |
          AAB_PATH=$(find artifacts/web-app/android -name "*.aab" | head -1)
          echo "Found AAB at: $AAB_PATH"
          cp "$AAB_PATH" "shiken-v${{ github.event.inputs.version_name }}-release.aab"

      - name: Upload AAB as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiken-android-aab-v${{ github.event.inputs.version_name }}
          path: shiken-v${{ github.event.inputs.version_name }}-release.aab
          retention-days: 30

      - name: Build Summary
        run: |
          echo "## Android AAB Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **App Name:** Shiken" >> $GITHUB_STEP_SUMMARY
          echo "- **Package ID:** com.shambhuanu.shiken" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ github.event.inputs.version_name }} (${{ github.event.inputs.version_code }})" >> $GITHUB_STEP_SUMMARY
          echo "- **File:** shiken-v${{ github.event.inputs.version_name }}-release.aab" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the AAB from the Artifacts section below." >> $GITHUB_STEP_SUMMARY
