name: Build Android AAB & APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'App version name (e.g. 1.0.0)'
        required: true
        default: '1.0.2'
      version_code:
        description: 'Version code (integer, increment each release)'
        required: true
        default: '4'

jobs:
  build-android:
    name: Build Signed AAB & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend (production)
        working-directory: artifacts/web-app
        run: pnpm run build
        env:
          FIREBASE_DEPLOY: true
          NODE_ENV: production

      - name: Fresh Clean & Add Android Platform
        working-directory: artifacts/web-app
        run: |
          pnpm add -D @capacitor/cli@^6.0.0 @capacitor/core@^6.0.0 @capacitor/android@^6.0.0
          
          if [ -d "dist/public" ]; then
            mv dist/public /tmp/public-assets
            rm -rf dist
            mv /tmp/public-assets dist
          fi
          
          rm -rf android
          npx cap init Shiken com.shambhuanu.shiken --web-dir=dist
          npx cap add android
          
          mkdir -p android/app/src/main/assets
          echo "{}" > android/app/src/main/assets/capacitor.plugins.json

      - name: Sync Capacitor
        working-directory: artifacts/web-app
        run: npx cap sync android

      - name: Set Version in build.gradle
        working-directory: artifacts/web-app
        run: |
          sed -i "s/versionCode .*/versionCode ${{ github.event.inputs.version_code }}/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"${{ github.event.inputs.version_name }}\"/" android/app/build.gradle

      - name: Decode Keystore File
        run: |
          mkdir -p ${{ github.workspace }}/keystore-holder
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/keystore-holder/release.keystore

      - name: Build Unsigned Release AAB & APK
        working-directory: artifacts/web-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Sign AAB using Official Android apksigner / jarsigner V2
        run: |
          RAW_AAB=$(find artifacts/web-app/android -name "*.aab" | grep "release" | head -1)
          RAW_APK=$(find artifacts/web-app/android -name "*.apk" | grep "release" | head -1)

          echo "🔐 Signing Bundle and APK..."
          
          # Sign AAB using jarsigner with RFC3161 timestamping support for Play Store
          jarsigner -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore ${{ github.workspace }}/keystore-holder/release.keystore \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            "$RAW_AAB" "${{ secrets.ANDROID_KEY_ALIAS }}"

          # Verify signature
          jarsigner -verify -verbose -certs "$RAW_AAB"

          cp "$RAW_AAB" "shiken-v${{ github.event.inputs.version_name }}-release.aab"
          cp "$RAW_APK" "shiken-v${{ github.event.inputs.version_name }}-release.apk"

      - name: Upload AAB as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiken-android-aab-v${{ github.event.inputs.version_name }}
          path: shiken-v${{ github.event.inputs.version_name }}-release.aab
          retention-days: 30

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiken-android-apk-v${{ github.event.inputs.version_name }}
          path: shiken-v${{ github.event.inputs.version_name }}-release.apk
          retention-days: 30

      - name: Build Summary
        run: |
          echo "## Android Build Complete! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "- **App Name:** Shiken" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ github.event.inputs.version_name }} (${{ github.event.inputs.version_code }})" >> $GITHUB_STEP_SUMMARY
