name: Build Android AAB & APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'App version name (e.g. 1.0.0)'
        required: true
        default: '1.0.1'
      version_code:
        description: 'Version code (integer, increment each release)'
        required: true
        default: '2'

jobs:
  build-android:
    name: Build Signed AAB & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend (production)
        working-directory: artifacts/web-app
        run: pnpm run build
        env:
          FIREBASE_DEPLOY: true
          NODE_ENV: production

      - name: Force Add and Sync Android Platform
        working-directory: artifacts/web-app
        run: |
          # 1. Compatibility Fix for Capacitor v6
          pnpm add -D @capacitor/cli@^6.0.0 @capacitor/core@^6.0.0 @capacitor/android@^6.0.0
          
          # 2. 🔥 EXACT POSITION FIX: dist/public se maal main dist folder me lana
          echo "📦 Moving build assets from dist/public to main dist folder..."
          if [ -d "dist/public" ]; then
            mv dist/public /tmp/public-assets
            rm -rf dist
            mv /tmp/public-assets dist
            echo "✅ Assets successfully migrated to root dist folder!"
          else
            echo "⚠️ dist/public nahi mila, cross-checking if index.html is in root dist..."
            if [ ! -f "dist/index.html" ]; then
              echo "❌ ERROR: index.html sahi jagah nahi mili!"
              exit 1
            fi
          fi
          
          # 3. Capacitor Initialise
          npx cap init Shiken com.shambhuanu.shiken --web-dir=dist || echo "Already initialized"
          
          # 4. Android Folder Setup/Repair
          if [ -d "android" ] && [ ! -f "android/gradlew" ]; then
            echo "⚠️ 'gradlew' missing! Repairing Android platform safely..."
            mkdir -p /tmp/app-backup
            cp -r android/app/* /tmp/app-backup/
            rm -rf android
            npx cap add android
            cp -r /tmp/app-backup/* android/app/ || echo "No backup to restore"
          elif [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android folder looks good."
          fi
          
          # 5. Placeholder Fix for assets
          mkdir -p android/app/src/main/assets
          echo "{}" > android/app/src/main/assets/capacitor.plugins.json

      - name: Sync Capacitor
        working-directory: artifacts/web-app
        run: npx cap sync android

      - name: Decode keystore from secret
        run: |
          mkdir -p ${{ github.workspace }}/keystore-holder
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/keystore-holder/release.keystore

      - name: Set version code and version name in build.gradle
        working-directory: artifacts/web-app/android/app
        run: |
          if [ -f build.gradle ]; then
            sed -i "s/versionCode .*/versionCode ${{ github.event.inputs.version_code }}/" build.gradle
            sed -i "s/versionName .*/versionName \"${{ github.event.inputs.version_name }}\"/" build.gradle
          fi

      - name: Build signed Release APK & AAB
        working-directory: artifacts/web-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/keystore-holder/release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Find and rename APK & AAB
        run: |
          AAB_PATH=$(find artifacts/web-app/android -name "*.aab" | head -1)
          APK_PATH=$(find artifacts/web-app/android -name "*.apk" | grep "release" | head -1)
          echo "Found AAB at: $AAB_PATH"
          echo "Found APK at: $APK_PATH"
          cp "$AAB_PATH" "shiken-v${{ github.event.inputs.version_name }}-release.aab"
          cp "$APK_PATH" "shiken-v${{ github.event.inputs.version_name }}-release.apk"

      - name: Upload AAB as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiken-android-aab-v${{ github.event.inputs.version_name }}
          path: shiken-v${{ github.event.inputs.version_name }}-release.aab
          retention-days: 30

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiken-android-apk-v${{ github.event.inputs.version_name }}
          path: shiken-v${{ github.event.inputs.version_name }}-release.apk
          retention-days: 30

      - name: Build Summary
        run: |
          echo "## Android Build Complete! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **App Name:** Shiken" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ github.event.inputs.version_name }} (${{ github.event.inputs.version_code }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **APK (For direct phone installation/testing)** has been generated." >> $GITHUB_STEP_SUMMARY
          echo "✅ **AAB (For Google Play Store upload)** has been generated." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download them from the **Artifacts** section at the bottom of this page." >> $GITHUB_STEP_SUMMARY
