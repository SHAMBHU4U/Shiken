openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: explain
    description: AI question explanation
paths:
  /explain:
    post:
      operationId: explainQuestion
      tags: [explain]
      summary: Explain a quiz question in Hindi using Gemini
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExplainRequest"
      responses:
        "200":
          description: Streaming SSE explanation text
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Bad request
        "500":
          description: Server error
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ExplainRequest:
      type: object
      properties:
        questionEnglish:
          type: string
        questionHindi:
          type: string
        options:
          type: array
          items:
            type: string
        correctAnswer:
          type: string
        subject:
          type: string
      required:
        - questionEnglish
        - options
        - correctAnswer
        - subject

